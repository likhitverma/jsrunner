  <body>
    <div class="container">
      <div class="main-content">
        <div class="editor-section">
          <div class="editor-header">
            <div class="toolbar">
              <div class="toolbar-left">
                <img src="/images/no-bg-logo.png" alt="JS Runner Logo" />
                <h1 class="main-title">JS RUNNER</h1>

              <div class="toolbar-right">
                <button id="runBtn" title="▶ Run Code (Ctrl + Enter)" aria-label="Run JavaScript code">

                </button>
                <button id="fullScreenBtn" title="Toggle Fullscreen" aria-label="Toggle fullscreen mode">

                </button>

                    class="fa-solid fa-moon fa-rotate-by fa-lg"
                    style="--fa-rotate-angle: -25deg"
                  ></i>
                </button>
                <button id="resetBtn" title="Reset Editor to Default" aria-label="Reset editor to default code">
                  <i class="fa-solid fa-arrows-rotate"></i>
                </button>
              </div>
            </div>
          </div>

          <div id="editor"></div>
        </div>

        <div id="divider"></div>
